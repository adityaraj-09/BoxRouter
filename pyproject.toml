[project]
name = "boxrouter"
version = "0.1.0"
description = "Round-robin sandbox router over provider API keys"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bespokelabs-sandbox>=0.2.0",
]

[project.optional-dependencies]
daytona = ["bespokelabs-sandbox[daytona]>=0.2.0"]
e2b = ["bespokelabs-sandbox[e2b]>=0.2.0"]
modal = ["bespokelabs-sandbox[modal]>=0.2.0"]
docker = ["bespokelabs-sandbox[docker]>=0.2.0"]
ray = ["bespokelabs-sandbox[ray]>=0.2.0"]
tensorlake = ["bespokelabs-sandbox[tensorlake]>=0.2.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["boxrouter*"]

[tool.setuptools.package-data]
boxrouter = ["pricing.json"]
